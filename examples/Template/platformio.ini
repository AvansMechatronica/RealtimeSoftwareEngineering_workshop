; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:Template]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
;platform = espressif32
board = esp32doit-devkit-v1
board_build.sdkconfig_defaults = sdkconfig.defaults
framework = arduino
monitor_speed = 115200

lib_deps =
  thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@^4.6.2

build_flags = -D CONFIG_FREERTOS_GENERATE_RUN_TIME_STATS=1
			  -D CONFIG_FREERTOS_USE_STATS_FORMATTING_FUNCTIONS=1
			  -D CONFIG_FREERTOS_USE_TRACE_FACILITY=1
			  -D CONFIG_FREERTOS_VTASKLIST_INCLUDE_COREID=1
			  -D LED_PIN_ESP32_BOARD=2 ; pin number for blue LED on ESP32 board
			  -D INCLUDE_OLED_DISPLAY=1 ; comment this line to disable OLED display support
			  -D INCLUDE_NODEMCU32_BOARD_SUPPORT=1 ; comment this line to disable Avans NodeMCU32 board support
			  ;-D DEBUG=1 ; Uncomment to enable debug mode

lib_extra_dirs = ../../libraries