; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:basics_framework]
; Using the pioarduino platform fork (Arduino-ESP32 3.x / ESP-IDF 5.x) instead of
; the official espressif32 platform, because only this generation builds FreeRTOS
; from source via the ESP-IDF component system. That is required for
; sdkconfig.defaults below to actually enable the trace facility (full task
; enumeration via uxTaskGetSystemState/vTaskList); the official platform's
; precompiled 2.0.x FreeRTOS library never exports those symbols.
; pip install -U platformio==6.2.0


platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
#platform = espressif32
#platform = https://github.com/tasmota/platform-espressif32/releases/download/2026.11.50/platform-espressif32.zip

board = esp32doit-devkit-v1
framework = arduino
board_build.sdkconfig_defaults = sdkconfig.defaults
monitor_speed = 115200

lib_extra_dirs = ../../../libraries

build_flags = -D CONFIG_FREERTOS_GENERATE_RUN_TIME_STATS=1
			  -D CONFIG_FREERTOS_USE_STATS_FORMATTING_FUNCTIONS=1
			  -D CONFIG_FREERTOS_USE_TRACE_FACILITY=1
			  -D CONFIG_FREERTOS_VTASKLIST_INCLUDE_COREID=1
			  -D LED_PIN_ESP32_BOARD=2


